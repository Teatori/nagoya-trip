name: Sanitize commit author emails

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sanitize:
    if: github.event.head_commit.message == 'Start email sanitization'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite commit metadata and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          NOREPLY='321367597+Teatori@users.noreply.github.com'
          git config user.name 'Teatori'
          git config user.email "$NOREPLY"

          git filter-branch --force --env-filter '
            export GIT_AUTHOR_NAME="Teatori"
            export GIT_AUTHOR_EMAIL="321367597+Teatori@users.noreply.github.com"
            export GIT_COMMITTER_NAME="Teatori"
            export GIT_COMMITTER_EMAIL="321367597+Teatori@users.noreply.github.com"
          ' -- main

          git rm .github/workflows/sanitize-history.yml
          git commit -m 'Remove temporary history sanitizer'
          git push --force origin HEAD:main
