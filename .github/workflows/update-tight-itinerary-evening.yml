      ],'''

          for old, new in [(old1,new1),(old2,new2),(old3,new3)]:
              if old not in s:
                  raise SystemExit('Expected itinerary block not found; aborting safely.')
              s = s.replace(old, new, 1)

          s = s.replace(
              'note: "犬山是三天里步行最多的一天。城、神社、城下町已经足够完整；河边和夜景都是可删的加项。"',
              'note: "紧凑版按约20:00收工设计：犬山回来后增加丰田产业技术纪念馆＋名站夜景；如果上午已经很累，优先删丰田馆，不删犬山主线。"',
              1
          )
          s = s.replace(
              'note: "这天最适合现场切换版本：下午精神好就加德川美术馆；累了直接去栄坐着逛。"',
