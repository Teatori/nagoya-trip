name: Update compact itineraries through evening
on:
  push:
    paths:
      - '.github/workflows/update-tight-itinerary-evening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch itinerary data
        run: |
          echo ':...' | base64 -d > /tmp/patch_itinerary.py
          python /tmp/patch_itinerary.py
      - name: Commit update
        run: |
          git config user.name 'Teatori'
          git config user.email '321367597+Teatori@users.noreply.github.com'
          git add js/curated-itinerary.js .github/workflows/update-tight-itinerary-evening.yml
          git commit -m 'Extend compact itineraries into evening'
          git push
