name: Install curated itinerary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Install curated itinerary loader'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="js/app.js?v=public1" defer></script>'
          addition = marker + '\n  <script src="js/curated-itinerary.js?v=1" defer></script>'
          if 'js/curated-itinerary.js' not in s:
              if marker not in s:
                  raise SystemExit('app.js marker not found')
              s = s.replace(marker, addition, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/install-curated-itinerary.yml
          git config user.name 'Teatori'
          git config user.email '321367597+Teatori@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable curated three-day itinerary view'
          git push origin HEAD:main
